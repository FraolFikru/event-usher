<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Event Usher – CBE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen font-sans">
  <div id="app" class="max-w-lg mx-auto min-h-screen flex flex-col bg-white shadow-xl">

    <!-- HEADER -->
    <header class="sticky top-0 z-20 bg-indigo-600 text-white px-4 py-3 shadow-md">
      <div class="flex items-center justify-between gap-3">
        <div>
          <h1 class="text-lg font-bold tracking-tight">Event Usher</h1>
          <p class="text-indigo-200 text-xs">CBE Auto Scanner</p>
        </div>
        <div class="flex items-center gap-2">
          <label class="text-xs text-indigo-200 whitespace-nowrap">Price / Person</label>
          <input id="priceInput" type="number" min="1" value="1000"
            class="w-24 px-2 py-1 rounded text-slate-800 text-sm font-semibold text-right focus:outline-none focus:ring-2 focus:ring-indigo-300" />
        </div>
      </div>
      <button id="resetBtn" class="mt-2 w-full text-xs bg-indigo-700 active:bg-indigo-900 rounded py-1.5 transition">
        Reset All Data
      </button>
    </header>

    <!-- DASHBOARD -->
    <section class="grid grid-cols-3 gap-2 p-3 bg-slate-50 border-b">
      <div class="metric-card">
        <p class="metric-label">Revenue</p>
        <p id="totalRevenue" class="metric-value text-emerald-600">0 Br</p>
      </div>
      <div class="metric-card">
        <p class="metric-label">People</p>
        <p id="totalPeople" class="metric-value text-indigo-600">0</p>
      </div>
      <div class="metric-card">
        <p class="metric-label">Entries</p>
        <p id="totalEntries" class="metric-value text-slate-700">0</p>
      </div>
    </section>

    <!-- UPLOAD + FORM -->
    <section class="p-4 space-y-4 border-b">
      <div class="space-y-2">
        <label class="block text-sm font-semibold text-slate-700">CBE Screenshot</label>
        <label for="fileInput" class="upload-box">
          <div id="uploadPrompt" class="text-center px-4">
            <p class="text-base font-medium text-indigo-700">📷 Take Photo</p>
            <p class="text-xs text-indigo-500 mt-1">Auto-reads TX ID + Amount</p>
          </div>
          <img id="previewImg" class="hidden max-h-32 rounded-lg object-contain" alt="Preview" />
          <div id="ocrLoading" class="hidden absolute inset-0 bg-indigo-900/85 flex flex-col items-center justify-center text-white rounded-xl">
            <div class="spinner mb-3"></div>
            <p class="text-sm font-semibold">Reading receipt...</p>
            <p class="text-xs opacity-80 mt-1">Usually under 3 seconds</p>
          </div>
        </label>
        <input id="fileInput" type="file" accept="image/*" capture="environment" class="hidden" />
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Transaction ID</label>
          <input id="txIdInput" type="text" readonly
            class="field-readonly" placeholder="Waiting for photo..." />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Amount (Birr)</label>
          <input id="amountInput" type="number" readonly
            class="field-readonly" placeholder="—" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Guest Count</label>
          <div class="flex items-center gap-3">
            <button id="minusBtn" type="button" class="count-btn">−</button>
            <input id="guestInput" type="number" min="1" value="1"
              class="flex-1 text-center text-2xl font-bold py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            <button id="plusBtn" type="button" class="count-btn">+</button>
          </div>
          <p id="calcHint" class="text-xs text-slate-400 mt-1 text-center"></p>
        </div>
      </div>

      <button id="confirmBtn" class="confirm-btn" disabled>
        Confirm & Admit
      </button>
      <p id="ocrStatus" class="text-center text-xs text-slate-400"></p>
    </section>

    <!-- TIMELINE -->
    <section class="flex-1 overflow-y-auto p-4">
      <h2 class="text-sm font-semibold text-slate-600 mb-3 flex items-center gap-2">
        <span>Activity Log</span>
        <span id="logCount" class="text-xs bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full">0</span>
      </h2>
      <div id="timeline" class="space-y-3"></div>
      <p id="emptyState" class="text-center text-slate-400 text-sm py-8">No entries yet</p>
    </section>
  </div>

  <!-- Modal -->
  <div id="modal" class="fixed inset-0 z-50 hidden bg-black/80 flex items-center justify-center p-4" onclick="closeModal()">
    <img id="modalImg" class="max-w-full max-h-full rounded-lg" alt="" />
  </div>

  <script src="app.js"></script>
</body>
</html>
