<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Event Usher – CBE Fast</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body { overscroll-behavior: none; }
    .scrollbar-thin::-webkit-scrollbar { width: 4px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen font-sans">
  <div id="app" class="max-w-lg mx-auto min-h-screen flex flex-col bg-white shadow-xl">

    <!-- CONFIG -->
    <header class="sticky top-0 z-20 bg-indigo-600 text-white px-4 py-3 shadow-md">
      <div class="flex items-center justify-between gap-3">
        <div>
          <h1 class="text-lg font-bold tracking-tight">Event Usher</h1>
          <p class="text-indigo-200 text-xs">CBE Auto Reader</p>
        </div>
        <div class="flex items-center gap-2">
          <label class="text-xs text-indigo-200 whitespace-nowrap">Price / Person</label>
          <input id="priceInput" type="number" min="1" value="1000"
            class="w-24 px-2 py-1 rounded text-slate-800 text-sm font-semibold text-right focus:outline-none focus:ring-2 focus:ring-indigo-300" />
        </div>
      </div>
      <button id="resetBtn" class="mt-2 w-full text-xs bg-indigo-700 active:bg-indigo-900 rounded py-1.5 transition">
        Reset All Data
      </button>
    </header>

    <!-- DASHBOARD -->
    <section class="grid grid-cols-3 gap-2 p-3 bg-slate-50 border-b">
      <div class="bg-white rounded-xl p-3 text-center shadow-sm border">
        <p class="text-[10px] uppercase text-slate-500 font-medium">Revenue</p>
        <p id="totalRevenue" class="text-lg font-bold text-emerald-600 mt-0.5">0 Br</p>
      </div>
      <div class="bg-white rounded-xl p-3 text-center shadow-sm border">
        <p class="text-[10px] uppercase text-slate-500 font-medium">People</p>
        <p id="totalPeople" class="text-lg font-bold text-indigo-600 mt-0.5">0</p>
      </div>
      <div class="bg-white rounded-xl p-3 text-center shadow-sm border">
        <p class="text-[10px] uppercase text-slate-500 font-medium">Entries</p>
        <p id="totalEntries" class="text-lg font-bold text-slate-700 mt-0.5">0</p>
      </div>
    </section>

    <!-- UPLOAD -->
    <section class="p-4 space-y-4 border-b">
      <div class="space-y-2">
        <label class="block text-sm font-semibold text-slate-700">CBE Screenshot</label>
        <label for="fileInput"
          class="relative flex flex-col items-center justify-center w-full h-36 border-2 border-dashed border-indigo-300 rounded-xl bg-indigo-50 active:bg-indigo-100 transition cursor-pointer overflow-hidden">
          <div id="uploadPrompt" class="text-center px-4">
            <p class="text-base font-medium text-indigo-700">📷 Take Photo</p>
            <p class="text-xs text-indigo-500 mt-1">Auto-reads Transaction ID + Amount</p>
          </div>
          <img id="previewImg" class="hidden max-h-32 rounded-lg object-contain" alt="Preview" />
          
          <!-- Loading overlay -->
          <div id="ocrLoading" class="hidden absolute inset-0 bg-indigo-900/85 flex flex-col items-center justify-center text-white">
            <div class="w-9 h-9 border-4 border-white border-t-transparent rounded-full animate-spin mb-3"></div>
            <p class="text-sm font-semibold">Reading receipt...</p>
            <p class="text-xs opacity-80 mt-1">2–5 seconds</p>
          </div>
        </label>
        <input id="fileInput" type="file" accept="image/*" capture="environment" class="hidden" />
      </div>

      <!-- Results (auto-filled) -->
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Transaction ID</label>
          <input id="txIdInput" type="text" readonly
            class="w-full px-3 py-3 rounded-lg border border-slate-200 bg-slate-50 text-base font-mono font-medium text-slate-800" 
            placeholder="Waiting for photo..." />
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Amount (Birr)</label>
          <input id="amountInput" type="number" readonly
            class="w-full px-3 py-3 rounded-lg border border-slate-200 bg-slate-50 text-base font-medium text-slate-800" 
            placeholder="—" />
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Guest Count</label>
          <div class="flex items-center gap-3">
            <button id="minusBtn" type="button"
              class="w-12 h-12 rounded-full bg-slate-200 active:bg-slate-400 text-2xl font-bold flex items-center justify-center">−</button>
            <input id="guestInput" type="number" min="1" value="1"
              class="flex-1 text-center text-2xl font-bold py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            <button id="plusBtn" type="button"
              class="w-12 h-12 rounded-full bg-slate-200 active:bg-slate-400 text-2xl font-bold flex items-center justify-center">+</button>
          </div>
          <p id="calcHint" class="text-xs text-slate-400 mt-1 text-center"></p>
        </div>
      </div>

      <button id="confirmBtn"
        class="w-full py-4 rounded-xl bg-emerald-600 active:bg-emerald-800 text-white font-bold text-lg shadow-md transition disabled:opacity-40"
        disabled>
        Confirm & Admit
      </button>

      <p id="ocrStatus" class="text-center text-xs text-slate-400"></p>
    </section>

    <!-- TIMELINE -->
    <section class="flex-1 overflow-y-auto scrollbar-thin p-4">
      <h2 class="text-sm font-semibold text-slate-600 mb-3 flex items-center gap-2">
        <span>Activity Log</span>
        <span id="logCount" class="text-xs bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full">0</span>
      </h2>
      <div id="timeline" class="space-y-3"></div>
      <p id="emptyState" class="text-center text-slate-400 text-sm py-8">No entries yet</p>
    </section>
  </div>

  <div id="modal" class="fixed inset-0 z-50 hidden bg-black/80 flex items-center justify-center p-4" onclick="closeModal()">
    <img id="modalImg" class="max-w-full max-h-full rounded-lg" alt="" />
  </div>

  <script>
    let pricePerPerson = 1000;
    let currentImage = null;
    let entries = [];
    let worker = null; // reused worker = much faster

    // DOM
    const priceInput   = document.getElementById('priceInput');
    const fileInput    = document.getElementById('fileInput');
    const previewImg   = document.getElementById('previewImg');
    const uploadPrompt = document.getElementById('uploadPrompt');
    const ocrLoading   = document.getElementById('ocrLoading');
    const txIdInput    = document.getElementById('txIdInput');
    const amountInput  = document.getElementById('amountInput');
    const guestInput   = document.getElementById('guestInput');
    const calcHint     = document.getElementById('calcHint');
    const confirmBtn   = document.getElementById('confirmBtn');
    const minusBtn     = document.getElementById('minusBtn');
    const plusBtn      = document.getElementById('plusBtn');
    const resetBtn     = document.getElementById('resetBtn');
    const timeline     = document.getElementById('timeline');
    const emptyState   = document.getElementById('emptyState');
    const logCount     = document.getElementById('logCount');
    const totalRevenue = document.getElementById('totalRevenue');
    const totalPeople  = document.getElementById('totalPeople');
    const totalEntries = document.getElementById('totalEntries');
    const ocrStatus    = document.getElementById('ocrStatus');
    const modal        = document.getElementById('modal');
    const modalImg     = document.getElementById('modalImg');

    // ========== INIT WORKER ONCE ==========
    async function initWorker() {
      ocrStatus.textContent = 'Preparing scanner...';
      try {
        worker = await Tesseract.createWorker('eng', 1, {
          logger: () => {} // silence logs
        });
        // Faster settings
        await worker.setParameters({
          tessedit_pageseg_mode: '6',        // Assume uniform block of text
          tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,: ',
        });
        ocrStatus.textContent = 'Ready – take a photo';
      } catch (e) {
        ocrStatus.textContent = 'Scanner failed to load. Refresh page.';
        console.error(e);
      }
    }

    // ========== STORAGE ==========
    function loadState() {
      try {
        const saved = localStorage.getItem('eventUsherCBE');
        if (saved) {
          const data = JSON.parse(saved);
          pricePerPerson = data.pricePerPerson || 1000;
          entries = data.entries || [];
          priceInput.value = pricePerPerson;
        }
      } catch (e) { entries = []; }
      render();
    }

    function saveState() {
      try {
        localStorage.setItem('eventUsherCBE', JSON.stringify({ pricePerPerson, entries }));
      } catch (e) {
        alert('Storage full – please reset old data');
      }
    }

    // Compress for storage + create small version for OCR
    function prepareImages(dataUrl) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          // 1. Storage version (small)
          const storeCanvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          const maxStore = 360;
          if (w > maxStore) { h = Math.round(h * maxStore / w); w = maxStore; }
          storeCanvas.width = w; storeCanvas.height = h;
          storeCanvas.getContext('2d').drawImage(img, 0, 0, w, h);
          const storeData = storeCanvas.toDataURL('image/jpeg', 0.45);

          // 2. OCR version (medium + high contrast)
          const ocrCanvas = document.createElement('canvas');
          let ow = img.width, oh = img.height;
          const maxOcr = 700;
          if (ow > maxOcr) { oh = Math.round(oh * maxOcr / ow); ow = maxOcr; }
          ocrCanvas.width = ow; ocrCanvas.height = oh;
          const ctx = ocrCanvas.getContext('2d');
          ctx.drawImage(img, 0, 0, ow, oh);

          // Boost contrast for better OCR
          const imageData = ctx.getImageData(0, 0, ow, oh);
          const d = imageData.data;
          for (let i = 0; i < d.length; i += 4) {
            const avg = (d[i] + d[i+1] + d[i+2]) / 3;
            const v = avg > 140 ? 255 : 0; // hard threshold
            d[i] = d[i+1] = d[i+2] = v;
          }
          ctx.putImageData(imageData, 0, 0);

          resolve({
            store: storeData,
            ocr: ocrCanvas.toDataURL('image/jpeg', 0.85)
          });
        };
        img.src = dataUrl;
      });
    }

    // ========== CBE PARSER ==========
    async function parseCBE(ocrDataUrl) {
      if (!worker) {
        await initWorker();
      }
      const { data: { text } } = await worker.recognize(ocrDataUrl);
      console.log('OCR:', text);

      // Transaction ID (CBE style)
      let txId = '';
      const ft = text.match(/FT[0-9A-Z]{8,16}/i);
      if (ft) txId = ft[0].toUpperCase();
      else {
        const m = text.match(/ID[:\s]*([A-Z0-9]{8,})/i);
        if (m) txId = m[1].toUpperCase();
      }

      // Amount – find all ETB numbers, pick the main transfer amount
      const matches = [...text.matchAll(/ETB\s*([\d,]+\.?\d*)/gi)];
      let amounts = matches
        .map(m => parseFloat(m[1].replace(/,/g, '')))
        .filter(a => a >= 100); // ignore tiny fees

      let amount = 0;
      if (amounts.length) {
        // Prefer whole numbers / .00 values (the real transfer amount)
        const clean = amounts.filter(a => Number.isInteger(a) || a % 1 === 0);
        amount = clean.length ? Math.max(...clean) : Math.max(...amounts);
      }

      return { txId, amount: Math.round(amount) };
    }

    // ========== HELPERS ==========
    function formatMoney(n) {
      return new Intl.NumberFormat('en-ET', {
        style: 'currency', currency: 'ETB', maximumFractionDigits: 0
      }).format(n).replace('ETB', 'Br');
    }
    function formatTime(ts) {
      return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    function updateCalcHint() {
      const amount = Number(amountInput.value) || 0;
      const calc = pricePerPerson > 0 ? Math.round(amount / pricePerPerson) : 0;
      calcHint.textContent = amount ? `${amount} Br ÷ ${pricePerPerson} = ${calc} people` : '';
    }
    function updateConfirmState() {
      confirmBtn.disabled = !(
        currentImage &&
        txIdInput.value.length > 5 &&
        Number(amountInput.value) > 0 &&
        Number(guestInput.value) > 0
      );
    }

    function renderDashboard() {
      const revenue = entries.reduce((s, e) => s + e.amount, 0);
      const people  = entries.reduce((s, e) => s + e.guestCount, 0);
      totalRevenue.textContent = formatMoney(revenue);
      totalPeople.textContent  = people;
      totalEntries.textContent = entries.length;
      logCount.textContent     = entries.length;
    }

    function renderTimeline() {
      if (entries.length === 0) {
        timeline.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');
      const sorted = [...entries].sort((a, b) => b.timestamp - a.timestamp);
      timeline.innerHTML = sorted.map(e => `
        <div class="bg-white border border-slate-200 rounded-xl p-3 shadow-sm flex gap-3">
          <img src="${e.image}" class="w-14 h-14 rounded-lg object-cover flex-shrink-0 cursor-pointer"
               onclick="openModal('${e.image}')" alt="" />
          <div class="flex-1 min-w-0">
            <div class="flex justify-between gap-2">
              <div>
                <p class="text-xs text-slate-400">${formatTime(e.timestamp)}</p>
                <p class="font-mono text-sm font-medium truncate">${e.txId}</p>
              </div>
              <span class="bg-indigo-100 text-indigo-700 text-xs font-semibold px-2 py-1 rounded-full">🎟️ ${e.guestCount}</span>
            </div>
            <p class="text-sm font-semibold text-emerald-600 mt-1">${formatMoney(e.amount)}</p>
          </div>
        </div>
      `).join('');
    }

    function render() {
      renderDashboard();
      renderTimeline();
    }

    // ========== EVENTS ==========
    priceInput.addEventListener('input', () => {
      pricePerPerson = Math.max(1, Number(priceInput.value) || 1000);
      updateCalcHint();
      saveState();
    });

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (ev) => {
        ocrLoading.classList.remove('hidden');
        ocrStatus.textContent = '';
        txIdInput.value = '';
        amountInput.value = '';
        guestInput.value = 1;

        try {
          const { store, ocr } = await prepareImages(ev.target.result);
          currentImage = store;
          previewImg.src = store;
          previewImg.classList.remove('hidden');
          uploadPrompt.classList.add('hidden');

          const { txId, amount } = await parseCBE(ocr);

          if (txId) txIdInput.value = txId;
          if (amount > 0) {
            amountInput.value = amount;
            guestInput.value = Math.max(1, Math.round(amount / pricePerPerson));
          }

          updateCalcHint();
          updateConfirmState();

          if (!txId || amount === 0) {
            ocrStatus.textContent = 'Could not read clearly – try better lighting or retake';
          } else {
            ocrStatus.textContent = '✓ Ready to confirm';
          }
        } catch (err) {
          console.error(err);
          ocrStatus.textContent = 'Read failed – try again';
        } finally {
          ocrLoading.classList.add('hidden');
        }
      };
      reader.readAsDataURL(file);
    });

    amountInput.addEventListener('input', () => { // still allow edit if needed
      updateCalcHint();
      const amount = Number(amountInput.value) || 0;
      if (pricePerPerson > 0 && amount > 0) {
        guestInput.value = Math.max(1, Math.round(amount / pricePerPerson));
      }
      updateConfirmState();
    });

    guestInput.addEventListener('input', updateConfirmState);
    minusBtn.addEventListener('click', () => {
      guestInput.value = Math.max(1, (Number(guestInput.value) || 1) - 1);
      updateConfirmState();
    });
    plusBtn.addEventListener('click', () => {
      guestInput.value = (Number(guestInput.value) || 0) + 1;
      updateConfirmState();
    });

    confirmBtn.addEventListener('click', () => {
      if (confirmBtn.disabled) return;

      entries.push({
        id: Date.now().toString(36),
        timestamp: Date.now(),
        txId: txIdInput.value.trim(),
        amount: Number(amountInput.value),
        guestCount: Number(guestInput.value),
        image: currentImage
      });
      saveState();
      render();

      // Reset
      currentImage = null;
      previewImg.src = '';
      previewImg.classList.add('hidden');
      uploadPrompt.classList.remove('hidden');
      fileInput.value = '';
      txIdInput.value = '';
      amountInput.value = '';
      guestInput.value = 1;
      calcHint.textContent = '';
      ocrStatus.textContent = 'Ready – take a photo';
      updateConfirmState();

      confirmBtn.textContent = '✓ Admitted';
      setTimeout(() => confirmBtn.textContent = 'Confirm & Admit', 800);
    });

    resetBtn.addEventListener('click', () => {
      if (!confirm('Clear all data?')) return;
      entries = [];
      pricePerPerson = 1000;
      priceInput.value = 1000;
      currentImage = null;
      previewImg.src = '';
      previewImg.classList.add('hidden');
      uploadPrompt.classList.remove('hidden');
      fileInput.value = '';
      txIdInput.value = '';
      amountInput.value = '';
      guestInput.value = 1;
      calcHint.textContent = '';
      ocrStatus.textContent = 'Ready – take a photo';
      updateConfirmState();
      saveState();
      render();
    });

    window.openModal = (src) => { modalImg.src = src; modal.classList.remove('hidden'); };
    window.closeModal = () => { modal.classList.add('hidden'); modalImg.src = ''; };

    // Start
    loadState();
    updateConfirmState();
    initWorker(); // prepare scanner in background
  </script>
</body>
</html>
